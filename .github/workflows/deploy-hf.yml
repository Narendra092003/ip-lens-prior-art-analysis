name: Test and deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run test suite
        run: uv run pytest

      - name: Add Hugging Face Space metadata in CI workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path("deploy/hf_space_header.md").read_text(encoding="utf-8")
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme_path.write_text(header.rstrip() + "\n\n" + readme, encoding="utf-8")
          PY

      - name: Check Hugging Face credentials
        id: hf_credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          missing=()
          [[ -n "$HF_TOKEN" ]] || missing+=(HF_TOKEN)
          [[ -n "$HF_USERNAME" ]] || missing+=(HF_USERNAME)
          if (( ${#missing[@]} == 0 )); then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Hugging Face push: missing ${missing[*]}."
          fi

      - name: Push tested image sources to Hugging Face
        if: steps.hf_credentials.outputs.available == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          set -euo pipefail
          git clone \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ip-lens" \
            hf-space
          rsync -a --delete --exclude=.git --exclude=hf-space/ --exclude=.env --exclude=.venv \
            --exclude=.pytest_cache/ --exclude='.uv-cache*/' --exclude='__pycache__/' \
            --exclude=data/ --exclude=outputs/ --exclude=examples/real/ ./ hf-space/
          git -C hf-space add -A
          if ! git -C hf-space diff --cached --quiet; then
            git -C hf-space -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy ${GITHUB_SHA}"
          fi
          git -C hf-space push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ip-lens" \
            HEAD:main
