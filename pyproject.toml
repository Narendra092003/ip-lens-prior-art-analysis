[project]
name = "ip-lens"
version = "0.1.0"
description = "Evidence-linked prior-art search and novelty-risk triage for human review"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "streamlit>=1.39.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
